[project]
name = "dexpigen"
version = "0.2.0"
description = "DEXPI 1.3 in-memory conceptual model"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dexpigen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
