[project]
name = "dexpigen"
version = "0.6.0"
description = "DEXPI 1.3 in-memory conceptual model"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "networkx>=3.7",
    "pydantic>=2.9",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dexpigen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
